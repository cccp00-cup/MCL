name: build

# 这个 workflow 的主要目的不是"出包"，而是**把 Windows 真的跑一遍**。
# mcl 全部开发都在 Linux 上做的，Windows 那边从来没有编译、更没有运行过 ——
# 靠读代码猜"应该没问题"是不够的，得有台真机器替我们回答。
#
# 三个 job：
#   windows —— 编译 + 离屏跑一帧（截图存在说明 QML 真的加载起来了）+ 出 NSIS 安装包
#   linux   —— 回归，确保 Windows 的改动没把原来那条路弄坏
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSVC + Qt 6.8)
    # 固定 windows-2022，不用 windows-latest。
    # 后者已经漂到新镜像上去了，预装的 VS 版本跟着变，
    # 而 Qt 的 win64_msvc2022_64 是要配 VS 2022 用的，绑住更稳。
    runs-on: windows-2022
    # 首次要下 WebEngine（几百 MB）+ 编译，实测 60 分钟会被砍掉。
    # 之后 install-qt-action 有缓存会快得多，但第一次必须留够。
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - name: 装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          # 用 MSVC 而不是 mingw：runner 自带 MSVC 工具链，
          # 省掉"CMake 挑错编译器去链 mingw 版 Qt"这类麻烦
          arch: win64_msvc2022_64
          # WebEngine 不在 Qt 的基础包里，它依赖的那几个模块也要一起点名 ——
          # 少一个 就会让 WebEngineQuickConfig 整体 find_package 失败，
          # 内置浏览器被静默跳过
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets'
          cache: true

      - name: 诊断 —— Qt 里到底有没有 WebEngine
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "--- lib/cmake 里的 WebEngine ---"
          $c = Get-ChildItem "$env:QT_ROOT_DIR\lib\cmake" -ErrorAction SilentlyContinue |
               Where-Object { $_.Name -match "WebEngine" }
          if ($c) { $c.Name } else { Write-Host "（cmake 配置里没有 WebEngine）" }

      - name: 配置
        # 这里**不写死 generator 版本** —— 镜像一升级，generator 名字就变了，
        # 让 CMake 自己挑当前可用的那个 VS，配 -A x64 定平台。
        # （最初写死 "Visual Studio 17 2022"，在 windows-latest 上直接找不到实例。）
        # zlib 走 FetchContent，需要联网拉源码。
        run: cmake -B build -A x64

      - name: 编译
        run: cmake --build build --config Release

      - name: 冒烟 —— 跑一帧
        shell: pwsh
        run: |
          # 这里**刻意不用 offscreen**：Qt 的 offscreen 插件在 Windows 上拿不到
          # 系统字体数据库，界面文字会全渲染成豆腐块（CI 第二版截图就是满屏方块）。
          # Linux 的 offscreen 走 fontconfig 所以没这问题。
          # runner 有真实的桌面会话，直接用默认平台开窗口即可。

          # 必须用 Start-Process -Wait，不能用 `& mcl.exe`。
          # mcl.exe 是 WIN32_EXECUTABLE（GUI 子系统），PowerShell 调 GUI 程序时
          # **不会等它结束**，直接往下走 —— 第一次 CI 就栽在这儿：
          # 0.3 秒后就去找截图，那会儿 QML 还没加载完呢。Linux 下 shell 会等，所以没暴露过。
          Start-Process -FilePath ".\build\Release\mcl.exe" `
                        -ArgumentList "--shot", "smoke.png" `
                        -Wait

          if (-not (Test-Path smoke.png)) {
            throw "没出图 —— QML 八成没加载起来"
          }
          Write-Host "截图 $((Get-Item smoke.png).Length) 字节"

      - name: 冒烟 —— 内置浏览器能否加载
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          # 离屏下 Chromium 起不来沙箱，CI 里没那个权限
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--no-sandbox --disable-gpu"

          # **必须带 --shot 让它自己退出**。GUI 程序不会自己结束 ——
          # 之前这行没带，配合管道等了它一个多小时才被超时砍掉。
          Start-Process -FilePath ".\build\Release\mcl.exe" `
                        -ArgumentList "--open", "browser", "--shot", "browser.png" -Wait

          if (-not (Test-Path browser.png)) {
            throw "浏览器窗口没出图"
          }

          # GUI 子系统没有控制台，所以判断只能读落盘的 mcl.log。
          # 光看有没有出图不算数 —— 没编进 WebEngine 时它只是开了个空窗口。
          $log = Join-Path $env:LOCALAPPDATA "mcl\mcl.log"
          if (-not (Select-String -Path $log -Pattern "内置浏览器: 有" -Quiet)) {
            throw "这版没编进 WebEngine —— 检查 modules: qtwebengine 那行"
          }
          Write-Host "内置浏览器可用"
      - name: 看看系统有哪些字体
        if: always()
        shell: pwsh
        run: |
          # 万一还有豆腐块，至少知道是"缺字体"还是"字体引擎没起来"
          $fonts = Get-ChildItem C:\Windows\Fonts -ErrorAction SilentlyContinue |
                   Select-Object -ExpandProperty Name
          Write-Host "字体总数: $($fonts.Count)"
          $cjk = $fonts | Where-Object { $_ -match 'msyh|simsun|simhei|simkai|Deng|Noto' }
          Write-Host "疑似中文字体: $(if ($cjk) { $cjk -join ', ' } else { '（一个都没有）' })"

      - name: 看看 mcl.log
        if: always()
        shell: pwsh
        run: |
          # Windows 上没有控制台，日志全在这儿 —— 出问题时它是唯一的线索
          $log = Join-Path $env:LOCALAPPDATA "mcl\mcl.log"
          if (Test-Path $log) {
            Write-Host "----- mcl.log（末尾 60 行）-----"
            Get-Content $log -Tail 60
          } else {
            Write-Host "没有生成 mcl.log"
          }

      - name: 冒烟截图存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: warn

      - name: 打 NSIS 安装包
        working-directory: build
        # qt_generate_deploy_app_script 生成的 install 脚本会在这时跑 windeployqt，
        # 把 Qt 的 dll 和 QML 插件收进安装目录
        run: cpack -C Release

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mcl-windows-installer
          path: build/mcl-*-win64.exe
          if-no-files-found: error

  linux:
    name: Linux (回归)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装编译工具和系统依赖
        # 只装系统层的：编译器、ninja、zlib、OpenGL。
        # Qt **不**走 apt —— ubuntu-24.04 带的只有 Qt 6.4.2，而 mcl 要求 6.5+，
        # 会直接在 find_package 那步失败。用和 Windows 一样的 6.8.2，
        # 顺便保证 CI 和本机开发环境版本一致。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build zlib1g-dev libgl1-mesa-dev \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libasound2t64 libxkbfile1 libminizip1 libwebpmux3 libxkbcommon-x11-0 \
            libvulkan-dev

      - name: 装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets'
          cache: true

      - name: 诊断 —— Qt 里到底有没有 WebEngine
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "--- lib/cmake 里的 WebEngine ---"
          ls "$QT_ROOT_DIR/lib/cmake" 2>/dev/null | grep -i webengine \
            || echo "（cmake 配置里没有 WebEngine）"
          echo "--- lib 里的 WebEngine ---"
          ls "$QT_ROOT_DIR/lib" 2>/dev/null | grep -i webengine | head -4 \
            || echo "（lib 里没有 WebEngine）"
          echo "--- qml 模块 ---"
          ls "$QT_ROOT_DIR/qml" 2>/dev/null | grep -i webengine \
            || echo "（qml 里没有 WebEngine）"

      - name: 配置
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build

      - name: 冒烟 —— 离屏跑一帧
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/mcl --shot smoke.png
          test -s smoke.png || { echo "没出图"; exit 1; }

      - name: 冒烟 —— 内置浏览器能否加载
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # 光看有没有出图不算数 —— 没编进 WebEngine 时它只是开了个空窗口。
          # WebEngine 在离屏下还要关掉沙箱，CI 容器里没那个权限。
          out=$(QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu" \
                ./build/mcl --open browser --shot browser.png 2>&1)
          echo "$out" | tail -20
          echo "$out" | grep -q "内置浏览器: 有" \
            || { echo "这版没编进 WebEngine —— 检查 modules: qtwebengine 那行"; exit 1; }
          test -s browser.png || { echo "浏览器窗口没出图"; exit 1; }
          echo "内置浏览器可用"

      - name: 打 deb
        run: |
          cd build && cpack -G DEB

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: mcl-linux-deb
          path: build/*.deb
          if-no-files-found: error
